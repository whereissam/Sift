[project]
name = "sift"
version = "0.2.0"
description = "Download audio from X Spaces, Apple Podcasts, and Spotify"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]
dependencies = [
    # The ingestion core, a workspace member (packages/sift-core).
    "sift-core",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
    "feedparser>=6.0.0",
    "python-multipart>=0.0.6",
    "mutagen>=1.47.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "sentry-sdk[fastapi]>=1.40.0",
    # Capped below 1.98: its Anthropic adapter imports typing.NotRequired,
    # which is 3.11+, so importing litellm fails outright on Python 3.10.
    "litellm>=1.30.0,<1.98",
    "opencc-python-reimplemented>=0.1.7",
    "youtube-transcript-api>=1.0.0",
    "av>=16.1.0",
    "numpy>=2.2.6",
    "ctranslate2>=4.6.3",
    # Capped below 1.24: onnxruntime dropped cp310 wheels there, and
    # requires-python is >=3.10 with CI testing 3.10. 1.23.2 is the last
    # release that publishes one.
    "onnxruntime>=1.23.2,<1.24",
    "spotdl>=3.9.6",
    "sentence-transformers>=3.0",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Pinned below 0.15: ruff 0.16 widened its default rule set, and
    # [tool.ruff] selects no explicit rules — so upgrading turns 1631
    # pre-existing style findings into CI failures on unchanged code.
    # Adopting the newer rules is its own triage, not a dep refresh.
    "ruff>=0.2.0,<0.15",
]
desktop = [
    "nuitka>=2.1",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
]
transcribe = [
    "faster-whisper>=1.0.0",
]
diarize = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
]
cloud = [
    "boto3>=1.34.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "dropbox>=12.0.0",
]
mcp = [
    # Pinned below 2.0: mcp 2.0 removed mcp.server.fastmcp, which the
    # server is built on. Upgrading is an API migration for all 17
    # tools, not a dependency bump.
    "mcp>=1.2.0,<2",
]

[project.scripts]
# `sift` / `xdownloader` (the CLI) come from sift-core.
sift-api = "app.main:main"
sift-bot = "app.bot:run_bot"
sift-mcp = "app.mcp_server.__main__:main"
# Backward compatibility aliases
xdownloader-api = "app.main:main"
xdownloader-bot = "app.bot:run_bot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv.workspace]
members = ["packages/sift-core"]

[tool.uv.sources]
sift-core = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Pinned below 0.15: ruff 0.16 widened its default rule set, and
    # [tool.ruff] selects no explicit rules — so upgrading turns 1631
    # pre-existing style findings into CI failures on unchanged code.
    # Adopting the newer rules is its own triage, not a dep refresh.
    "ruff>=0.2.0,<0.15",
    # Pinned below 2.0: mcp 2.0 removed mcp.server.fastmcp, which the
    # server is built on. Upgrading is an API migration for all 17
    # tools, not a dependency bump.
    "mcp>=1.2.0,<2",
]
